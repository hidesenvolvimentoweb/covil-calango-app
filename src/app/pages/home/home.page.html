<ion-content class="home-content">
  <main class="home-page">
    <header class="welcome-header">
      <div class="welcome-copy">
        <p class="eyebrow">BEM-VINDO AO COVIL</p>
        <h1>Olá, <span>{{ usuario?.nome }}!</span></h1>
        <p class="welcome-subtitle">Sua próxima experiência começa aqui.</p>
      </div>
      <button class="profile-button" type="button" aria-label="Abrir perfil" (click)="toRoute('/perfil')">
        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <section class="order-highlight" aria-label="Número da sua comanda">
      <div class="order-icon">
        <ion-icon name="fast-food-outline" aria-hidden="true"></ion-icon>
      </div>
      <div class="order-copy">
        <p class="order-label">SUA COMANDA</p>
        <h2>Nº {{ comanda?.numero }}</h2>
        <p class="order-caption">Seu atendimento começa por aqui</p>
      </div>
      <span class="order-decoration" aria-hidden="true"></span>
    </section>

    <section class="actions-section" aria-labelledby="actions-title">
      <div class="section-heading">
        <h2 id="actions-title">O que deseja fazer?</h2>
        <p>Acesse os serviços do Covil</p>
      </div>

      <div class="action-list">
        <button class="action-card featured-action" type="button" (click)="toRoute('/cardapio')">
          <span class="action-icon">
            <ion-icon name="restaurant-outline" aria-hidden="true"></ion-icon>
          </span>
          <span class="action-copy">
            <span class="action-title">Cardápio Digital</span>
            <span class="action-description">Confira as opções disponíveis</span>
          </span>
          <ion-icon class="action-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

        <button class="action-card" type="button" (click)="toRoute('/meus-pedidos')">
          <span class="action-icon">
            <ion-icon name="receipt-outline" aria-hidden="true"></ion-icon>
          </span>
          <span class="action-copy">
            <span class="action-title">Meus Pedidos</span>
            <span class="action-description">Acompanhe seus pedidos</span>
          </span>
          <ion-icon class="action-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

        <button class="action-card" type="button" (click)="toRoute('/minha-comanda')">
          <span class="action-icon">
            <ion-icon name="wallet-outline" aria-hidden="true"></ion-icon>
          </span>
          <span class="action-copy">
            <span class="action-title">Minha Comanda</span>
            <span class="action-description">Confira seus pedidos e o total</span>
          </span>
          <ion-icon class="action-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>

        <button class="action-card" type="button" (click)="toRoute('/perfil')">
          <span class="action-icon">
            <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
          </span>
          <span class="action-copy">
            <span class="action-title">Meu Perfil</span>
            <span class="action-description">Acesse suas informações</span>
          </span>
          <ion-icon class="action-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>
    </section>
  </main>
</ion-content>

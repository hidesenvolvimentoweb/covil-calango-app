<ion-content class="menu-content">
  <main class="menu-page">
    <header class="page-intro">
      <p class="eyebrow">FEITO PARA VOCÊ</p>
      <h1>Cardápio Digital</h1>
      <p class="intro-caption">Encontre seu próximo favorito no Covil.</p>
    </header>

    <div class="search-container">
      <ion-searchbar
        class="product-search"
        placeholder="Pesquisar produtos"
        aria-label="Pesquisar produtos"
        [debounce]="1000"
        (ionInput)="handleInput($event)">
      </ion-searchbar>
    </div>

    <section class="category-section" aria-label="Categorias do cardápio">
      <h2 class="section-title">Categorias</h2>
      <div class="category-list">
        <button
          class="category-chip"
          type="button"
          *ngFor="let categoria of categorias"
          [class.selected]="categoriaSelecionada === categoria.valor"
          [attr.aria-pressed]="categoriaSelecionada === categoria.valor"
          (click)="selecionarCategoria(categoria.valor)">
          <ion-icon [name]="categoria.icone" aria-hidden="true"></ion-icon>
          <span>{{ categoria.nome }}</span>
        </button>
      </div>
    </section>

    <section class="product-list" *ngIf="carregando" aria-busy="true" aria-label="Carregando produtos">
      <ion-card class="product-card" *ngFor="let item of itensSkeleton">
        <div class="product-image-container">
          <ion-skeleton-text animated class="skeleton-image"></ion-skeleton-text>
        </div>
        <ion-card-header>
          <ion-skeleton-text animated class="skeleton-line skeleton-title"></ion-skeleton-text>
        </ion-card-header>
        <ion-card-content>
          <ion-skeleton-text animated class="skeleton-line skeleton-label"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-line skeleton-short"></ion-skeleton-text>
          <ion-skeleton-text animated class="skeleton-button"></ion-skeleton-text>
        </ion-card-content>
      </ion-card>
    </section>

    <section class="product-list" *ngIf="!carregando && listaDeProdutosFiltrada.length">
      <ion-card class="product-card" *ngFor="let produto of listaDeProdutosFiltrada">
        <div class="product-image-container">
          <img
            *ngIf="urlImagem(produto) as url; else semImagem"
            [attr.alt]="produto.nome"
            [attr.src]="url"
            loading="lazy"
            (error)="registrarErroImagem(produto)" />
          <ng-template #semImagem>
            <div class="product-image-placeholder" aria-hidden="true">
              <ion-icon [name]="getIconeCategoria(getCategoriaProduto(produto))"></ion-icon>
            </div>
          </ng-template>
          <div class="product-price">
            <strong>{{ produto.valor | currency: 'BRL' }}</strong>
          </div>
        </div>
        <ion-card-header>
          <ion-card-title>{{ produto.nome }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p class="ingredients-label">INGREDIENTES</p>
          <p class="ingredients">{{ produto.ingredientes }}</p>
          <ion-button *ngIf="!isEsgotado(produto); else esgotado" expand="block" color="primary" (click)="realizarPedido(produto)">
            Eu Quero!
            <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
          </ion-button>
          <ng-template #esgotado>
            <ion-button expand="block" color="medium" disabled>
              Esgotado
              <ion-icon slot="end" name="close-circle-outline" aria-hidden="true"></ion-icon>
            </ion-button>
          </ng-template>
        </ion-card-content>
      </ion-card>
    </section>

    <section class="empty-state" *ngIf="!carregando && !listaDeProdutosFiltrada.length">
      <div class="empty-icon">
        <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
      </div>
      <h2>Nenhum produto encontrado</h2>
      <p>Tente pesquisar por outro nome ou ingrediente.</p>
    </section>
  </main>
</ion-content>

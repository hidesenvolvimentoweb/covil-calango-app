<ion-content class="confirmation-content">
  <main class="confirmation-page">
    <p class="eyebrow">QUASE LÁ</p>
    <h1>Revise seu pedido</h1>

    <ion-card class="confirmation-card">
      <div class="product-image-container" *ngIf="produto?.imagem">
        <img [src]="produto.imagem" [alt]="produto.nome" />
      </div>

      <ion-card-header>
        <p class="product-label">SEU PEDIDO</p>
        <ion-card-title>{{ quantidade?.value }}x {{ produto?.nome }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form">
          <div class="quantity-row">
            <div class="quantity-copy">
              <span class="quantity-title">Quantidade</span>
              <span class="quantity-caption">Mínimo de 1 unidade</span>
            </div>
            <div class="quantity-control">
              <ion-button
                type="button"
                fill="clear"
                aria-label="Remover uma unidade"
                [disabled]="quantidade?.value <= 1"
                (click)="removerProduto()">
                <ion-icon slot="icon-only" name="remove-circle-outline" aria-hidden="true"></ion-icon>
              </ion-button>
              <ion-input
                class="quantity-input"
                type="number"
                min="1"
                inputmode="numeric"
                aria-label="Quantidade"
                formControlName="quantidade">
              </ion-input>
              <ion-button
                type="button"
                fill="clear"
                aria-label="Adicionar uma unidade"
                (click)="addProduto()">
                <ion-icon slot="icon-only" name="add-circle-outline" aria-hidden="true"></ion-icon>
              </ion-button>
            </div>
          </div>
        </form>

        <div class="total-row">
          <span>Total do pedido</span>
          <strong>{{ (produto?.valor || 0) * (quantidade?.value || 0) | currency: 'BRL' }}</strong>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-button class="confirm-button" expand="block" color="primary" (click)="confirmarPedido()">
      Confirmar Pedido
      <ion-icon slot="end" name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
    </ion-button>
  </main>
</ion-content>

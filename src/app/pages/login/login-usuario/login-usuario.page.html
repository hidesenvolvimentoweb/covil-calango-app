<ion-content>
  <img src="../../../../assets/images/logo-covil.png" class="logo-covil fixed" alt="Covil do Calango">
  <form class="login-form fixed" [formGroup]="form" (ngSubmit)="login()">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" name="email" formControlName="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input type="password" name="senha" formControlName="senha"></ion-input>
    </ion-item>
    <ion-button color="light" fill="outline" expand="block" type="submit" [disabled]="form.invalid || enviando">
      <ion-icon color="secondary" slot="start" name="log-in-outline"></ion-icon>
      Entrar
    </ion-button>
    <ion-button color="light" fill="outline" expand="block" type="button" (click)="voltar()">
      <ion-icon color="secondary" slot="start" name="arrow-back-outline"></ion-icon>
      Voltar
    </ion-button>
  </form>
</ion-content>

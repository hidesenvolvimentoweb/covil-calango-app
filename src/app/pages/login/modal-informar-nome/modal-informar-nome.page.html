<ion-header class="text-center">
  <ion-toolbar>
    <ion-title>Qual o seu nome?</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form">
    <ion-item>
      <ion-label position="floating">Nome</ion-label>
      <ion-input formControlName="usuario"></ion-input>
    </ion-item>

    <ion-item lines="none" class="whatsapp-consent">
      <ion-checkbox slot="start" formControlName="notificarWhatsapp"></ion-checkbox>
      <ion-label class="ion-text-wrap">
        Quero receber pelo WhatsApp as atualizações dos meus pedidos
      </ion-label>
    </ion-item>

    <ion-item *ngIf="notificarWhatsapp">
      <ion-label position="floating">WhatsApp (com DDD)</ion-label>
      <ion-input
        formControlName="celular"
        type="tel"
        inputmode="tel"
        maxlength="15"
        placeholder="(83) 99999-9999"
        (ionInput)="formatarCelular($event)">
      </ion-input>
    </ion-item>
    <p class="field-error" *ngIf="notificarWhatsapp && form.get('celular')?.touched && form.get('celular')?.invalid">
      Informe um número de WhatsApp válido, com DDD.
    </p>

    <ion-col size="12" class="text-center">
      <ion-button color="primary" [disabled]="form.invalid" (click)="gerarNumeroComanda()" expand="block"> Gerar</ion-button>
    </ion-col>
  </form>
</ion-content>

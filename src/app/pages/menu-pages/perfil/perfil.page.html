<app-ygo-header-component [title]="'Perfil'"></app-ygo-header-component>

<ion-content class="profile-content">
  <main class="profile-page">
    <section class="profile-card">
      <div class="profile-avatar">
        <img src="https://gravatar.com/avatar/dba6bae8c566f9d4041fb9cd9ada7741?d=identicon&f=y" alt="Foto do perfil">
      </div>
      <p class="eyebrow">SEU ESPAÇO NO COVIL</p>
      <h1>Olá, <span>{{ usuario.nome }}!</span></h1>
      <p class="profile-description">
        Em breve, você poderá visualizar a quantidade de Calango Coins que possui aqui, além de informações e bônus adicionais!
      </p>
    </section>

    <section class="profile-options" aria-label="Opções do perfil">
      <button class="profile-option" type="button" (click)="openModalRegrasPermanencia()">
        <span class="option-icon">
          <ion-icon name="reader-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="option-copy">
          <span class="option-title">Regras de Permanência</span>
          <span class="option-description">Consulte as regras do espaço</span>
        </span>
        <ion-icon class="option-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>

      <button class="profile-option" type="button" (click)="openModalInformacoesCalango()">
        <span class="option-icon">
          <ion-icon name="leaf-outline" aria-hidden="true"></ion-icon>
        </span>
        <span class="option-copy">
          <span class="option-title">Sobre a Covil</span>
          <span class="option-description">Conheça mais sobre a gente</span>
        </span>
        <ion-icon class="option-arrow" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
      </button>
    </section>

    <footer class="profile-footer">
      <p>Versão {{ version }}</p>
      <ion-button class="logout-button" color="primary" (click)="sair()" size="small">
        <ion-icon slot="start" name="exit-outline" aria-hidden="true"></ion-icon>
        Sair
      </ion-button>
    </footer>
  </main>
</ion-content>

<ion-header class="profile-modal-header">
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-modal-content">
  <main class="information-page">
    <div class="information-icon">
      <ion-icon [name]="title === 'Sobre a Covil' ? 'leaf-outline' : 'reader-outline'" aria-hidden="true"></ion-icon>
    </div>
    <section class="information-card">
      <p class="eyebrow">COVIL DO CALANGO</p>
      <p class="information-copy">{{ content }}</p>
    </section>
  </main>
</ion-content>

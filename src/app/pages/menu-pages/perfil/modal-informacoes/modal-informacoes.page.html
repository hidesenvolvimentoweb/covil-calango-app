<ion-content class="profile-modal-content">
  <main class="information-page">
    <div class="information-icon">
      <ion-icon [name]="title === 'Sobre a Covil' ? 'leaf-outline' : 'reader-outline'" aria-hidden="true"></ion-icon>
    </div>
    <section class="information-card">
      <p class="eyebrow">COVIL DO CALANGO</p>
      <div *ngIf="carregando; else conteudo" aria-busy="true" aria-label="Carregando informações">
        <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
        <ion-skeleton-text animated class="skeleton-line skeleton-short"></ion-skeleton-text>
      </div>
      <ng-template #conteudo>
        <p class="information-copy">{{ content }}</p>
      </ng-template>
    </section>
  </main>
</ion-content>
